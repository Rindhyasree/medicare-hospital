<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Appointment - Medicare Hospital</title>
    <link rel="stylesheet" href="medicare.css">
</head>
<body>

<header>
    <h1>🏥 Medicare Hospital</h1>
    <nav>
        <a href="home.html">Home</a>
        <a href="doctors.html">Doctors</a>
        <a href="booking.html">Book Appointment</a>
        <a href="payment.html">Payment</a>
    </nav>
</header>

<section>
    <h2>Book Your Appointment</h2>

    <form action="payment.html" method="get">

        <label>Patient Name</label>
        <input type="text" name="name" placeholder="Enter Your Name" required>

        <label>Age</label>
        <input type="number" name="age" placeholder="Enter Your Age" required>

        <label>Gender</label>
        <select name="gender" required>
            <option value="">Select Gender</option>
            <option>Male</option>
            <option>Female</option>
            <option>Other</option>
        </select>

        <label>Phone Number</label>
        <input type="tel" name="phone" placeholder="Enter Phone Number" required>

        <label>Email</label>
        <input type="email" name="email" placeholder="Enter Email Address" required>

        <label>Select Doctor</label>
        <select name="doctor" required>
            <option value="">Choose Doctor</option>
            <option>Dr. John Smith - Cardiologist</option>
            <option>Dr. Sarah Johnson - Neurologist</option>
            <option>Dr. David Wilson - Orthopedic</option>
        </select>

        <label>Appointment Date</label>
        <input type="date" name="date" required>

        <label>Appointment Time</label>
        <input type="time" name="time" required>

        <label>Reason for Visit</label>
        <textarea name="reason" rows="4" placeholder="Describe your health problem"></textarea>

        <button type="submit">Proceed to Payment</button>

    </form>

</section>

<footer>
    <p>&copy; 2026 Medicare Hospital | All Rights Reserved.</p>
</footer>

</body>
</html>
